<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veículos — Controle de Manutenção de Frota</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <h1>Veículos / Equipamentos</h1>
  </header>
  <div class="app-body">
  <main class="app-main">
    <div class="card">
      <h3 id="form-title">Novo veículo/equipamento</h3>
      <div id="form-errors" class="error-list" style="display:none"></div>
      <form id="vehicle-form">
        <input type="hidden" id="vehicle-id" />
        <div class="field-row">
          <div class="field">
            <label for="vehicle-tipo">Tipo *</label>
            <select id="vehicle-tipo" required>
              <option value="">Selecione...</option>
              <option value="caminhao">Caminhão</option>
              <option value="betoneira">Betoneira</option>
            </select>
          </div>
          <div class="field">
            <label for="vehicle-identificador">Placa / nº de identificação *</label>
            <input type="text" id="vehicle-identificador" required />
          </div>
          <div class="field">
            <label for="vehicle-nome">Nome / apelido</label>
            <input type="text" id="vehicle-nome" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Salvar</button>
          <button type="button" class="secondary" id="cancel-edit" style="display:none">Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="section-title">Veículos cadastrados</div>
    <div id="list-msg" class="info-msg" style="display:none"></div>
    <div id="vehicle-list"><p class="empty-state">Carregando...</p></div>
  </main>
    <nav class="primary-nav" id="app-nav"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/utils.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/veiculos.js"></script>
</body>
</html>
